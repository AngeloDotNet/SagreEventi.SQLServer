<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Sagre &amp; Eventi</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sagre, feste e festival enogastronomici segnalati da chi ci va.">
  <meta name="theme-color" content="#99213f">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sagre">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
  <script>
    // Applica il tema prima del primo render, per evitare il lampo bianco.
    (function () {
      try {
        // Stesse classi che applica ThemeService: qui serve solo a evitare il lampo prima dell'avvio di Angular
        var classi = {
          dark: ['app-dark'],
          halloween: ['app-dark', 'app-halloween'],
          natale: ['app-natale'],
          'natale-scuro': ['app-dark', 'app-natale-scuro'],
          pasqua: ['app-pasqua'],
          ferragosto: ['app-ferragosto']
        };
        var s = localStorage.getItem('sagreeventi.theme');
        var applica = s ? classi[s] || [] : window.matchMedia('(prefers-color-scheme: dark)').matches ? classi.dark : [];
        for (var i = 0; i < applica.length; i++) document.documentElement.classList.add(applica[i]);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Questa applicazione richiede JavaScript.</noscript>
</body>
</html>

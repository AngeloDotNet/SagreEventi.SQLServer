map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # API: forwarded to the "sagreeventi-api" container through the Docker network (the API port is not published).
    # ^~ keeps the static-file rule below from catching /api/... paths.
    # The name is resolved at request time (variable + Docker DNS), so nginx starts even if the API container is down
    location ^~ /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://sagreeventi-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Scheme seen by the host nginx (https after certbot); falls back to the local one when the header is missing
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_pass $api_upstream;
    }

    # Service worker (PWA): these files have fixed names and must be rechecked at every visit, or users never see a new release.
    # Exact-match locations win over the regex rule below, so they are not caught by the long cache
    location = /ngsw.json {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /safety-worker.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location = /worker-basic.min.js {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed files (main-XXXX.js, chunk-XXXX.js, styles-XXXX.css): cacheable for a long time
    location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Runtime configuration (apiBaseUrl) and the shell: never cached, to pick up new releases at once
    location = /config.json {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: every other route is handled by the Angular router
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
